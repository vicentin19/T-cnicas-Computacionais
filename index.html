<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Você Decide o Futuro da IA</title>
</head>
<body>
    <div class="caixa-principal">
        <!-- Título com Ícone -->
        <h1 class="titulo-jogo">
            <svg class="icone-titulo" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
            Você Decide o Futuro da IA
        </h1>
        
        <!-- Tela Inicial -->
        <div class="tela-inicial">
            <p class="descricao-intro">
                Em um futuro próximo, a inteligência artificial mudará a forma como vivemos e estudamos. Suas escolhas definirão o seu destino nesta jornada.
            </p>
            <button class="iniciar-btn">
                <span>Iniciar Jornada</span>
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>

        <!-- Indicador de Progresso -->
        <div class="caixa-progresso" style="display: none;">
            <div class="barra-progresso">
                <div class="progresso-preenchimento"></div>
            </div>
        </div>

        <!-- Conteúdo do Jogo -->
        <div class="caixa-perguntas"></div>
        <div class="caixa-alternativas"></div>
        
        <!-- Tela de Resultado -->
        <div class="caixa-resultado">
            <p class="texto-resultado"></p>
            <button class="novamente-btn">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 4v6h-6"></path>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
                <span>Jogar Novamente</span>
            </button>
        </div>
    </div>

    <!-- Script Principal em Módulo -->
    <script type="module" src="js/script.js"></script>
</body>
</html>
